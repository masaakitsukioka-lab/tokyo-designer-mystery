<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<title>
東京デザイナー・アカデミー殺人事件
</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

background:#000;

color:white;

font-family:
"Courier New",
monospace;

}


#game{

width:1000px;

height:720px;

margin:12px auto;

border:8px solid #555;

background:#111;

image-rendering:pixelated;

position:relative;

}



/* タイトル */

#title{

width:100%;

height:100%;

text-align:center;

padding-top:70px;

background:#000;

}


.logo{

width:760px;

height:auto;

margin:auto;

display:block;

image-rendering:pixelated;

}



.start{

margin-top:60px;

font-size:32px;

cursor:pointer;

animation:
blink 1s infinite;

}



.copy{

margin-top:80px;

font-size:14px;

}

@keyframes blink{

50%{

opacity:0.3;

}

}



/* ゲーム画面 */

#screen{

display:none;

height:100%;

}



.top{

height:500px;

display:flex;

}



/* コマンド */

.commands{

width:155px;

border-right:4px solid white;

padding:15px 12px;

overflow-y:auto;

}



.command{

font-size:16px;

margin-bottom:16px;

cursor:pointer;

display:block;

width:100%;

padding:0;

border:0;

background:transparent;

color:white;

font-family:inherit;

text-align:left;

}


.command:hover{

color:#ffff00;

}

.commandMenuTitle{

margin-bottom:12px;

font-size:14px;

line-height:1.35;

color:#ffff00;

}

.commandChoice{

margin:0 0 8px;

padding:2px 0;

font-size:14px;

line-height:1.3;

}

.commandBack{

margin-top:10px;

color:#aaa;

}



/* 画像 */

.scene{

flex:1;

padding:14px;

}


.image{

height:220px;

border:4px solid white;

display:flex;

align-items:center;

justify-content:center;

font-size:24px;

background:#222;

}



/* テキスト */

.message{

height:220px;

border-top:4px solid white;

padding:14px 18px;

font-size:16px;

line-height:1.8;

white-space:pre-line;

overflow:hidden;

}



.cursor{

color:#ffff00;

}

.cursor{

animation:blink 1s infinite;

color:#ffff00;

}


@keyframes blink{

50%{

opacity:0;

}

}

/* v0.5 画像システム */


.imageArea{

height:440px;

aspect-ratio:1448 / 1086;

width:auto;

margin:0 auto;

border:3px solid white;

display:flex;

justify-content:center;

align-items:center;

background:#000;

position:relative;

overflow:hidden;

}



#sceneImage{

width:100%;

height:100%;

object-fit:cover;

image-rendering:pixelated;

}

.characterSprite{

display:none;

position:absolute;

right:8%;

bottom:0;

z-index:2;

height:82%;

max-width:42%;

object-fit:contain;

object-position:center bottom;

image-rendering:pixelated;

pointer-events:none;

}

/* 人物ごとの表示サイズ。足元を基準に拡大・縮小する。 */
.characterSprite[data-character="hou"]{

transform:scale(0.9);
transform-origin:center bottom;

}

.characterSprite[data-character="kimura"]{

transform:scale(1.2);
transform-origin:center bottom;

}

#image{

white-space:pre-line;
text-align:center;
line-height:1.7;
color:#aaa;

}

.choice{

display:block;
width:100%;
margin:10px 0;
padding:6px 10px;
border:0;
background:transparent;
color:white;
font:inherit;
font-size:16px;
text-align:left;
cursor:pointer;

}

.choice:hover,
.choice:focus{

color:#ffff00;
outline:1px solid #ffff00;

}



.characterImage{

position:absolute;

bottom:260px;

right:40px;

width:180px;

height:180px;

border:3px solid white;

background:#222;

display:flex;

align-items:center;

justify-content:center;

font-size:18px;

}

.credits{

height:100%;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
padding:24px;
font-size:16px;
line-height:1.3;
animation:creditsFade 2s ease-in;
overflow:hidden;

}

.credits p:nth-child(2){

font-size:22px;
color:#ffff00;

}

.credits p{

margin:4px 0;

}

.credits p:last-child{

margin-top:16px;
font-size:48px;
line-height:1;
color:#ffff00;

}

@keyframes creditsFade{

from{ opacity:0; }
to{ opacity:1; }

}

</style>

</head>


<body>


<div id="game">



<div id="title">

<audio id="titleBgm" src="audio/title.mp3" loop autoplay preload="auto"></audio>

<img class="logo" src="images/title.png" alt="東京デザイナー・アカデミー殺人事件">



<div class="start">

▶ START

</div>

<div class="copy">

2026 Masaaki Tsukioka All rights reserved

</div>



</div>





<div id="screen">



<div class="top">


<div class="commands">


<div class="command">
▶ ばしょいどう
</div>


<div class="command">
▶ きく
</div>


<div class="command">
▶ しらべる
</div>


<div class="command">
▶ みせる
</div>


<div class="command">
▶ とる
</div>


<div class="command">
▶ さがす
</div>


<div class="command">
▶ もちもの
</div>


</div>




<div class="scene">


<div class="imageArea">

<img id="sceneImage"
alt="">

<img id="characterSprite" class="characterSprite" alt="">

<div id="image" aria-live="polite"></div>

</div>


</div>


</div>




<div class="message" id="message">

</div>



</div>



</div>

<script src="game.js"></script>

</body>

</html>
